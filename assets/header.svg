<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="220" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f1420"/>
      <stop offset="100%" stop-color="#090c12"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5865f2"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#5865f2"/>
    </linearGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#334155" opacity="0.4"/>
    </pattern>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      .pulse-dot {
        animation: blink 2.4s ease-in-out infinite;
      }
      .mono {
        font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="920" height="220" rx="10" fill="url(#bgGrad)"/>
  <rect width="920" height="220" rx="10" fill="url(#grid)"/>

  <!-- Outer Border & Glow Accent Line -->
  <rect x="0.5" y="0.5" width="919" height="219" rx="9.5" stroke="#1e293b" stroke-width="1"/>
  <rect x="0" y="0" width="920" height="3" fill="url(#accentGrad)"/>

  <!-- Top System Bar -->
  <g class="mono" font-size="11">
    <!-- Status Indicator -->
    <circle cx="28" cy="28" r="4.5" fill="#22c55e" class="pulse-dot"/>
    <text x="42" y="32" fill="#86efac" font-weight="600" letter-spacing="1">SYS_ONLINE</text>
    <text x="145" y="32" fill="#475569">|</text>
    <text x="160" y="32" fill="#94a3b8" letter-spacing="0.5">UID: 242512219</text>
    <text x="270" y="32" fill="#475569">|</text>
    <text x="285" y="32" fill="#94a3b8" letter-spacing="0.5">CALLSIGN: DAMNDEV</text>
    
    <!-- Right Telemetry -->
    <text x="892" y="32" text-anchor="end" fill="#64748b" letter-spacing="0.5">LOCATION: DAMNDEV.XYZ</text>
  </g>

  <!-- Divider Line -->
  <line x1="24" y1="46" x2="896" y2="46" stroke="#1e293b" stroke-width="1"/>

  <!-- Main Headline -->
  <g transform="translate(26, 68)">
    <text class="sans" x="0" y="44" fill="#f8fafc" font-size="44" font-weight="800" letter-spacing="-1">
      POOR POTATO
    </text>
    <text class="mono" x="330" y="44" fill="#5865f2" font-size="32" font-weight="700" letter-spacing="0.5">
      // DAMNDEV
    </text>
    <text class="mono" x="0" y="74" fill="#38bdf8" font-size="12.5" font-weight="500" letter-spacing="1.5">
      SOFTWARE ARCHITECT // DISCORD GATEWAY INTERNALS // FULL-STACK RUNTIMES
    </text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="24" y1="164" x2="896" y2="164" stroke="#1e293b" stroke-width="1"/>

  <!-- Bottom Modules Grid -->
  <g class="mono" font-size="10.5" transform="translate(26, 178)">
    <!-- Node 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="10" fill="#64748b" font-weight="600">01 / RUNTIMES</text>
      <text x="0" y="26" fill="#cbd5e1" font-weight="500">TypeScript · Python · Shell</text>
    </g>

    <!-- Node 2 -->
    <g transform="translate(225, 0)">
      <text x="0" y="10" fill="#64748b" font-weight="600">02 / PLATFORM INTERNALS</text>
      <text x="0" y="26" fill="#cbd5e1" font-weight="500">Vencord · Discord.js · Automation</text>
    </g>

    <!-- Node 3 -->
    <g transform="translate(470, 0)">
      <text x="0" y="10" fill="#64748b" font-weight="600">03 / WEB &amp; 3D SYSTEMS</text>
      <text x="0" y="26" fill="#cbd5e1" font-weight="500">Next.js · React · Three.js</text>
    </g>

    <!-- Node 4 -->
    <g transform="translate(695, 0)">
      <text x="0" y="10" fill="#64748b" font-weight="600">04 / INFRASTRUCTURE</text>
      <text x="0" y="26" fill="#cbd5e1" font-weight="500">Ubuntu · Cloudflare · Pterodactyl</text>
    </g>
  </g>
</svg>
