<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" fill="none">
  <defs>
    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="850" height="140" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="4" height="140" rx="2" fill="#58a6ff"/>

  <!-- Main Info -->
  <g transform="translate(32, 38)">
    <text class="sans" x="0" y="0" fill="#f0f6fc" font-size="26" font-weight="700">poor potato</text>
    <text class="mono" x="160" y="-2" fill="#8b949e" font-size="14" font-weight="500">/ damndev</text>
    
    <text class="sans" x="0" y="28" fill="#8b949e" font-size="14">
      building discord bots, automation scripts, and web apps.
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 48)" class="mono" font-size="11">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="85" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="42.5" y="15" fill="#c9d1d9" text-anchor="middle">JavaScript</text>

      <!-- Tag 2 -->
      <rect x="93" y="0" width="85" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="135.5" y="15" fill="#c9d1d9" text-anchor="middle">TypeScript</text>

      <!-- Tag 3 -->
      <rect x="186" y="0" width="65" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="218.5" y="15" fill="#c9d1d9" text-anchor="middle">Python</text>

      <!-- Tag 4 -->
      <rect x="259" y="0" width="70" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="294" y="15" fill="#c9d1d9" text-anchor="middle">Node.js</text>

      <!-- Tag 5 -->
      <rect x="337" y="0" width="60" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="367" y="15" fill="#c9d1d9" text-anchor="middle">Linux</text>
    </g>
  </g>

  <!-- Website Link Box (Right Side) -->
  <g transform="translate(670, 52)">
    <rect width="145" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#3fb950"/>
    <text class="mono" x="32" y="22" fill="#58a6ff" font-size="12" font-weight="600">damndev.xyz</text>
  </g>
</svg>
