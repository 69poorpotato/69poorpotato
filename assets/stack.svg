<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 210" width="100%" fill="none">
  <defs>
    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      .col-title {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        font-weight: 600;
        fill: #58a6ff;
      }
      .item-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        fill: #c9d1d9;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="850" height="210" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Card Title -->
  <g transform="translate(24, 28)">
    <text class="sans" x="0" y="0" fill="#f0f6fc" font-size="16" font-weight="600">skills &amp; tools</text>
    <text class="sans" x="110" y="0" fill="#8b949e" font-size="13">technologies i work with</text>
  </g>
  <line x1="24" y1="42" x2="826" y2="42" stroke="#21262d" stroke-width="1"/>

  <!-- Column 1: Languages -->
  <g transform="translate(24, 56)">
    <rect width="254" height="134" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text class="col-title" x="16" y="26">languages</text>
    
    <g transform="translate(16, 48)">
      <circle cx="4" cy="0" r="3" fill="#3fb950"/>
      <text class="item-text" x="14" y="4">JavaScript</text>

      <circle cx="4" cy="22" r="3" fill="#3fb950"/>
      <text class="item-text" x="14" y="26">TypeScript</text>

      <circle cx="4" cy="44" r="3" fill="#3fb950"/>
      <text class="item-text" x="14" y="48">Python</text>

      <circle cx="4" cy="66" r="3" fill="#3fb950"/>
      <text class="item-text" x="14" y="70">Bash / Shell</text>
    </g>
  </g>

  <!-- Column 2: Web & Libraries -->
  <g transform="translate(298, 56)">
    <rect width="254" height="134" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text class="col-title" x="16" y="26">frameworks &amp; libraries</text>
    
    <g transform="translate(16, 48)">
      <circle cx="4" cy="0" r="3" fill="#58a6ff"/>
      <text class="item-text" x="14" y="4">Node.js</text>

      <circle cx="4" cy="22" r="3" fill="#58a6ff"/>
      <text class="item-text" x="14" y="26">Next.js / React</text>

      <circle cx="4" cy="44" r="3" fill="#58a6ff"/>
      <text class="item-text" x="14" y="48">Three.js</text>

      <circle cx="4" cy="66" r="3" fill="#58a6ff"/>
      <text class="item-text" x="14" y="70">Discord.js / Discord.py</text>
    </g>
  </g>

  <!-- Column 3: Tools & Systems -->
  <g transform="translate(572, 56)">
    <rect width="254" height="134" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text class="col-title" x="16" y="26">tools &amp; platforms</text>
    
    <g transform="translate(16, 48)">
      <circle cx="4" cy="0" r="3" fill="#8b949e"/>
      <text class="item-text" x="14" y="4">Linux (Ubuntu)</text>

      <circle cx="4" cy="22" r="3" fill="#8b949e"/>
      <text class="item-text" x="14" y="26">Git &amp; GitHub</text>

      <circle cx="4" cy="44" r="3" fill="#8b949e"/>
      <text class="item-text" x="14" y="48">Cloudflare</text>

      <circle cx="4" cy="66" r="3" fill="#8b949e"/>
      <text class="item-text" x="14" y="70">Pterodactyl Panel</text>
    </g>
  </g>
</svg>
