<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="260" fill="none">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#080b11"/>
    </linearGradient>

    <style>
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: cursorBlink 1.1s infinite;
      }
      .mono {
        font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="920" height="260" rx="8" fill="url(#termBg)"/>
  <rect x="0.5" y="0.5" width="919" height="259" rx="7.5" stroke="#1e293b" stroke-width="1"/>

  <!-- Titlebar -->
  <rect width="920" height="34" rx="8" fill="#111622"/>
  <rect y="26" width="920" height="8" fill="#111622"/>
  <line x1="0" y1="34" x2="920" y2="34" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="22" cy="17" r="5" fill="#ef4444"/>
  <circle cx="38" cy="17" r="5" fill="#f59e0b"/>
  <circle cx="54" cy="17" r="5" fill="#10b981"/>

  <!-- Titlebar Text -->
  <text class="mono" x="460" y="21" fill="#64748b" font-size="11" text-anchor="middle" font-weight="500">
    poorpotato@damndev: ~/systems (sh)
  </text>

  <!-- Terminal Content -->
  <g class="mono" font-size="12" transform="translate(24, 60)">
    <!-- Command Prompt -->
    <text x="0" y="0" fill="#38bdf8" font-weight="600">poorpotato@damndev</text>
    <text x="145" y="0" fill="#64748b">:</text>
    <text x="155" y="0" fill="#a78bfa">~/systems</text>
    <text x="235" y="0" fill="#f8fafc">$</text>
    <text x="250" y="0" fill="#f1f5f9" font-weight="500">sysctl --inspect --target=runtime</text>

    <!-- Output Lines -->
    <g transform="translate(0, 24)" font-size="11.5">
      <!-- Line 1 -->
      <text x="0" y="0" fill="#5865f2" font-weight="600">[CALLSIGN]</text>
      <text x="110" y="0" fill="#cbd5e1">Poor Potato // DamnDev (UID: 242512219)</text>

      <!-- Line 2 -->
      <text x="0" y="22" fill="#5865f2" font-weight="600">[SPECIALTY]</text>
      <text x="110" y="22" fill="#cbd5e1">Discord Gateway Internals | Headless Daemons | Full-Stack Web &amp; 3D</text>

      <!-- Line 3 -->
      <text x="0" y="44" fill="#5865f2" font-weight="600">[LANGUAGES]</text>
      <text x="110" y="44" fill="#cbd5e1">TypeScript, Python, POSIX Shell, JavaScript, Modern Web Standards</text>

      <!-- Line 4 -->
      <text x="0" y="66" fill="#5865f2" font-weight="600">[PLATFORMS]</text>
      <text x="110" y="66" fill="#cbd5e1">Vencord Plugins, discord.js/py, Next.js, Three.js (WebGL), React</text>

      <!-- Line 5 -->
      <text x="0" y="88" fill="#5865f2" font-weight="600">[SYSTEM ENV]</text>
      <text x="110" y="88" fill="#cbd5e1">Ubuntu Linux (Headless), Cloudflare Edge, Pterodactyl Infrastructure</text>

      <!-- Line 6 -->
      <text x="0" y="110" fill="#5865f2" font-weight="600">[STATUS]</text>
      <text x="110" y="110" fill="#4ade80" font-weight="600">ACTIVE</text>
      <text x="175" y="110" fill="#64748b">— Deployments stable; no critical interrupts detected.</text>

      <!-- Next Prompt with Blinking Cursor -->
      <g transform="translate(0, 140)">
        <text x="0" y="0" fill="#38bdf8" font-weight="600">poorpotato@damndev</text>
        <text x="145" y="0" fill="#64748b">:</text>
        <text x="155" y="0" fill="#a78bfa">~/systems</text>
        <text x="235" y="0" fill="#f8fafc">$</text>
        <rect class="cursor" x="250" y="-11" width="7.5" height="15" fill="#38bdf8"/>
      </g>
    </g>
  </g>
</svg>
